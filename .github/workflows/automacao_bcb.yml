name: Atualizar Dados BCB Diariamente

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  executar_script:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' 

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o script de extração (ETL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
       
        run: |
          cd scripts
          python etl_python.py
